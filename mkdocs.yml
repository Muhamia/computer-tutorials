site_name: 计算机教程

site_url: https://Muhamia.github.io/computer-tutorials/

theme:
  name: material
  features:
    - content.code.copy
    - content.code.select

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

nav:

  - 首页: index.md

  - 计算机基本素养:
